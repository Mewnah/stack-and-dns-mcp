# Smithery (smithery.ai) deployment descriptor.
# Registers the server as a stdio MCP built from the Dockerfile in this repo.
# No API key setting: a stdio server never contacts a hosted deployment, and
# STACKDNS_API_KEY only selects among keys configured in the same process.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      dnsServers:
        type: string
        title: DNS servers
        description: Comma-separated resolvers to use instead of the host defaults, each an IP, ipv4:port, [ipv6]:port or [ipv4]:port with a port of 1-65535 (STACKDNS_DNS_SERVERS). Anything else stops the server at startup.
      fetchTimeoutMs:
        type: integer
        title: Fetch timeout (ms)
        description: Per-attempt homepage fetch deadline in ms (500-30000); with its TLS and http:// fallbacks a fetch ends by twice this. Default 3000.
        minimum: 500
        maximum: 30000
        default: 3000
      logLevel:
        type: string
        title: Log level
        enum: [debug, info, warn, error, silent]
        default: warn
    required: []
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js", "--stdio"],
      env: {
        STACKDNS_TRANSPORT: "stdio",
        STACKDNS_DNS_SERVERS: config.dnsServers || "",
        STACKDNS_FETCH_TIMEOUT_MS: String(config.fetchTimeoutMs || 3000),
        STACKDNS_LOG_LEVEL: config.logLevel || "warn",
        STACKDNS_USAGE_FILE: "/tmp/stack-and-dns-usage.json"
      }
    })
build:
  dockerfile: Dockerfile
  dockerBuildPath: .
